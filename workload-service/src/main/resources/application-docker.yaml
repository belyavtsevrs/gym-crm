server:
  port: 8083

spring:
  application:
    name: workload-service
  datasource:
    url: jdbc:h2:mem:workloadDb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
eureka:
  client:
    service-url:
      defaultZone: http://dicovery-service:8761/eureka
management:
  health:
    refresh:
      enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html