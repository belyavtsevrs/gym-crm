server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://gym-security-db:5431/security
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: create-drop
    data:
      redis:
        host: redis
        port: 6379
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/