spring:
  application:
    name: gym-core
  datasource:
    url: jdbc:postgresql://localhost:5430/gym_crm
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true