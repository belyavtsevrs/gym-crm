version: "3.9"

services:
  gym-core-db:
    container_name: gym-core-postgres
    image: postgres:16
    restart: always
    shm_size: 128mb
    ports:
      - "5430:5432"
    environment:
      POSTGRES_DB: gym_crm
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

  gym-security-db:
    container_name: gym-security-postgres
    image: postgres:16
    restart: always
    shm_size: 128mb
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: gym_crm
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root

  redis:
    image: redis:6.2
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server","--appendonly","yes"]

  activemq: 
    image: apache/activemq-artemis:latest-alpine
    container_name: activemq
    restart: always
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: root
      ARTEMIS_PASSWORD: root