server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5430/gym_crm
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
cucumber:
  workload:
    service:
      name: workload-service
      url: http://localhost:8083
