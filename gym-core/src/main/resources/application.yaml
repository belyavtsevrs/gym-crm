server:
  port: 8080

spring:
  application:
    name: gym-core
  datasource:
    url: jdbc:postgresql://localhost:5430/gym_crm
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
  workload:
    service:
      name: workload-service
      url: http://localhost:8083
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: prometheus,health,mappings
  prometheus:
    metrics:
      export:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      gym-security:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
      workload-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
feign:
  circuitbreaker:
    enabled: true