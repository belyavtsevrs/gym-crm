server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://gym-core-db:5430/core
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://gym-security:8081
  workload:
    service:
      name: workload-service
      url: http://workload-service:8083

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/


      eureka:
        client:
          service-url:
            defaultZone: http://localhost:8761/eureka/