server:
  port: 8083

spring:
  application:
    name: workload-service
  datasource:
    url: jdbc:h2:mem:workloadDb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka