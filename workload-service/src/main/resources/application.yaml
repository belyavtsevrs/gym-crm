server:
  port: 8083

spring:
  application:
    name: workload-service
  artemis:
    broker-url: tcp://localhost:61612
    user: root
    password: root
  jms:
    listener:
      session:
        acknowledge-mode: auto

management:
  health:
    refresh:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html