spring:
  config:
    activate:
      on-profile: dev
  application:
    name: gym-core
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
jwt:
  secret: "efewfqwefwqefwqefwqefweqsdvzvfaewecfwqebtbtwerweergvdfsv"
  expiration: 360000

management:
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: prometheus,health,mappings
  prometheus:
    metrics:
      export:
        enabled: true